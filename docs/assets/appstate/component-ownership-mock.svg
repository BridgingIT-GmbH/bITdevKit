<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 890" width="1120" height="890" role="img" aria-labelledby="title description">
  <title id="title">Independent AppState owners in two catalog panes</title>
  <desc id="description">Documentation mock, not an implemented page. The left catalog pane searches for tools on page 2. The right pane searches for books on page 1. Each component owns a lease with a separate model, history, version, and subscriptions. Both use scoped AppState services from one existing runtime DI scope. Optional browser preferences use different stable instance keys, left-pane and right-pane.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#526272" />
    </marker>
    <style>
      text { font-family: "DejaVu Sans", sans-serif; fill: #172737; }
      .small { font-size: 16px; }
      .body { font-size: 18px; }
      .label { font-size: 19px; }
      .heading { font-size: 23px; font-weight: 600; }
      .muted { fill: #4c5d6b; }
      .button { fill: #ffffff; stroke: #a7b4be; stroke-width: 1.5; }
      .rule { stroke: #d8e0e6; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1120" height="890" fill="#ffffff" />
  <text x="32" y="42" font-size="28" font-weight="600">Where AppState works</text>
  <rect x="806" y="16" width="282" height="34" rx="6" fill="#eef2f5" />
  <text x="947" y="39" text-anchor="middle" class="small" font-weight="600">DOCUMENTATION MOCK</text>
  <text x="32" y="80" class="body muted">Two views can keep different preferences within one Blazor runtime.</text>

  <rect x="32" y="112" width="1056" height="512" rx="12" fill="#f5f7f9" stroke="#a7b4be" stroke-width="1.5" />
  <path d="M 32 168 H 1088" class="rule" />
  <text x="56" y="148" class="heading">Catalog console</text>
  <text x="1064" y="148" text-anchor="end" class="small muted">Optional browser preferences enabled</text>

  <g aria-label="Left component, independent state A">
    <rect x="56" y="186" width="492" height="414" rx="8" fill="#ffffff" stroke="#b5c7c7" stroke-width="1.5" />
    <path d="M 64 186 H 540 Q 548 186 548 194 V 198 H 56 V 194 Q 56 186 64 186 Z" fill="#246465" />
    <text x="80" y="234" class="heading">Left pane</text>
    <text x="80" y="270" class="label">Search</text>
    <rect x="80" y="282" width="444" height="48" rx="5" fill="#ffffff" stroke="#7b9298" stroke-width="1.5" />
    <text x="96" y="313" class="label">tools</text>
    <text x="80" y="366" class="label">Page</text>
    <rect x="146" y="340" width="48" height="38" rx="5" fill="#edf5f4" stroke="#b5c7c7" />
    <text x="170" y="366" text-anchor="middle" class="label">2</text>
    <rect x="80" y="398" width="94" height="42" rx="5" class="button" />
    <text x="127" y="426" text-anchor="middle" class="body">Undo</text>
    <rect x="186" y="398" width="94" height="42" rx="5" class="button" />
    <text x="233" y="426" text-anchor="middle" class="body">Redo</text>
    <rect x="292" y="398" width="94" height="42" rx="5" class="button" />
    <text x="339" y="426" text-anchor="middle" class="body">Reset</text>
    <rect x="80" y="454" width="94" height="42" rx="5" class="button" />
    <text x="127" y="482" text-anchor="middle" class="body">Load</text>
    <rect x="186" y="454" width="94" height="42" rx="5" fill="#246465" />
    <text x="233" y="482" text-anchor="middle" class="body" style="fill:#ffffff">Save</text>
    <text x="302" y="481" class="small muted">Preferences ready</text>
    <path d="M 56 520 H 548" class="rule" />
    <rect x="57" y="521" width="490" height="78" rx="7" fill="#edf5f4" />
    <text x="80" y="552" class="label" font-weight="600">State A</text>
    <text x="524" y="552" text-anchor="end" class="small muted">key: left-pane</text>
    <text x="80" y="580" class="small">Own model, history, version, subscriptions</text>
  </g>

  <g aria-label="Right component, independent state B">
    <rect x="572" y="186" width="492" height="414" rx="8" fill="#ffffff" stroke="#cebea3" stroke-width="1.5" />
    <path d="M 580 186 H 1056 Q 1064 186 1064 194 V 198 H 572 V 194 Q 572 186 580 186 Z" fill="#805c27" />
    <text x="596" y="234" class="heading">Right pane</text>
    <text x="596" y="270" class="label">Search</text>
    <rect x="596" y="282" width="444" height="48" rx="5" fill="#ffffff" stroke="#998971" stroke-width="1.5" />
    <text x="612" y="313" class="label">books</text>
    <text x="596" y="366" class="label">Page</text>
    <rect x="662" y="340" width="48" height="38" rx="5" fill="#f8f2e8" stroke="#cebea3" />
    <text x="686" y="366" text-anchor="middle" class="label">1</text>
    <rect x="596" y="398" width="94" height="42" rx="5" class="button" />
    <text x="643" y="426" text-anchor="middle" class="body">Undo</text>
    <rect x="702" y="398" width="94" height="42" rx="5" class="button" />
    <text x="749" y="426" text-anchor="middle" class="body">Redo</text>
    <rect x="808" y="398" width="94" height="42" rx="5" class="button" />
    <text x="855" y="426" text-anchor="middle" class="body">Reset</text>
    <rect x="596" y="454" width="94" height="42" rx="5" class="button" />
    <text x="643" y="482" text-anchor="middle" class="body">Load</text>
    <rect x="702" y="454" width="94" height="42" rx="5" fill="#805c27" />
    <text x="749" y="482" text-anchor="middle" class="body" style="fill:#ffffff">Save</text>
    <text x="818" y="481" class="small muted">Preferences ready</text>
    <path d="M 572 520 H 1064" class="rule" />
    <rect x="573" y="521" width="490" height="78" rx="7" fill="#f8f2e8" />
    <text x="596" y="552" class="label" font-weight="600">State B</text>
    <text x="1040" y="552" text-anchor="end" class="small muted">key: right-pane</text>
    <text x="596" y="580" class="small">Own model, history, version, subscriptions</text>
  </g>

  <path d="M 302 624 V 660" fill="none" stroke="#526272" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 818 624 V 660" fill="none" stroke="#526272" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="32" y="670" width="1056" height="142" rx="10" fill="#edf1f6" stroke="#9aadc0" stroke-width="1.5" />
  <text x="56" y="706" class="heading">One existing runtime DI scope</text>
  <text x="56" y="744" class="body">Scoped factory + manager + debugger. Both states use the shared scoped store provider.</text>
  <text x="56" y="780" class="body">Optional storage keeps separate instance keys: left-pane and right-pane.</text>
  <text x="32" y="850" class="body muted">Each component owns its lease. Closing one pane releases that pane's state and work.</text>
</svg>
