theme:
  name: material
  custom_dir: docs/site/overrides
  logo: assets/images/bITDevKit_Icon.svg
  favicon: assets/images/bITDevKit_Icon.svg
  font: false
  features:
    - navigation.instant
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: tokyo-night
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Tokyo Night theme
    - scheme: matte-black
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Matte Black theme
    - scheme: catppuccin
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Catppuccin theme
    - scheme: lumon
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Lumon theme
    - scheme: ethereal
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Ethereal theme
    - scheme: everforest
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Everforest theme
    - scheme: hackerman
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Hackerman theme
    - scheme: osaka-jade
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Osaka Jade theme
    - scheme: kanagawa
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Kanagawa theme
    - scheme: vantablack
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Vantablack theme
    - scheme: ristretto
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Ristretto theme
    - scheme: retro-82
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Retro 82 theme
    - scheme: flexoki-light
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Flexoki Light theme
    - scheme: catppuccin-latte
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Catppuccin Latte theme
    - scheme: white
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use White theme
    - scheme: system
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Use System theme

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/themes.css
  - assets/stylesheets/extra.css
  - assets/stylesheets/theme-picker.css

extra_javascript:
  - assets/javascripts/disable-keyboard-shortcuts.js
  - assets/javascripts/context7-widget.js
  - assets/javascripts/theme-picker.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bridgingIT/bITdevKit
      name: GitHub
    - icon: fontawesome/solid/cube
      link: https://www.nuget.org/packages?q=bitdevkit
      name: NuGet
