site_name: bITdevKit
site_description: Modular .NET libraries and templates for Domain-Driven Design, application workflows, infrastructure integration, and developer operations.
site_url: https://bridgingit-gmbh.github.io/bITdevKit/
repo_url: https://github.com/bridgingIT/bITdevKit
repo_name: bridgingIT/bITdevKit
docs_dir: docs/site
site_dir: .github/pages
use_directory_urls: true

