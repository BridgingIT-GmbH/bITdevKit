theme:
  name: material
  custom_dir: docs/site/overrides
  logo: assets/images/bITDevKit_Icon.svg
  favicon: assets/images/bITDevKit_Icon.svg
  font: false
  features:
    - navigation.instant
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Use system theme
    - media: "(prefers-color-scheme: light)"
      scheme: light
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Use light theme
    - media: "(prefers-color-scheme: dark)"
      scheme: dark
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Use dark theme
    - scheme: catppuccin
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Catppuccin theme
    - scheme: darkforest
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Darkforest theme
    - scheme: carbon
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Carbon theme
    - scheme: tokionights
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Tokyo Night theme
    - scheme: matrix
      primary: custom
      accent: custom
      toggle:
        icon: material/palette
        name: Use Matrix theme

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/themes.css
  - assets/stylesheets/extra.css
  - assets/stylesheets/theme-picker.css

extra_javascript:
  - assets/javascripts/disable-keyboard-shortcuts.js
  - assets/javascripts/context7-widget.js
  - assets/javascripts/theme-picker.js

extra_javascript:
  - assets/javascripts/disable-keyboard-shortcuts.js
  - assets/javascripts/context7-widget.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bridgingIT/bITdevKit
      name: GitHub
    - icon: fontawesome/solid/cube
      link: https://www.nuget.org/packages?q=bitdevkit
      name: NuGet
